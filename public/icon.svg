<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Stylized Board Outline -->
  <rect x="96" y="96" width="256" height="320" rx="32" stroke="url(#boardGrad)" stroke-width="40" stroke-linecap="round" />
  
  <!-- Board Lines -->
  <line x1="168" y1="184" x2="280" y2="184" stroke="url(#boardGrad)" stroke-width="32" stroke-linecap="round" />
  <line x1="168" y1="264" x2="240" y2="264" stroke="url(#boardGrad)" stroke-width="32" stroke-linecap="round" />

  <!-- Bold Overlapping Checkmark -->
  <path d="M 232 320 L 304 392 L 448 248" stroke="url(#checkGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#checkGlow)" />
</svg>
